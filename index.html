<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCP · Informe de Instalación de Equipos</title>
<meta name="description" content="Sistema para la gestión y generación de informes de instalación y configuración de equipos informáticos en HCP Arquitectos.">
<meta property="og:title" content="HCP · Informe de Instalación de Equipos">
<meta property="og:description" content="Sistema para la gestión y generación de informes de instalación y configuración de equipos informáticos en HCP Arquitectos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Colores oficiales - Manual de Marca HCP */
    --hcp-violet:#6B35FF;
    --hcp-violet-dark:#5520EE;
    --hcp-lime:#D8FF00;
    --hcp-pink:#FF006E;
    --hcp-gray:#888888;
    --hcp-dark:#0B0C10;
    --hcp-darker:#050608;
    --hcp-surface-dark:#14161E;
    --hcp-border-dark:#222634;

    --primary:var(--hcp-violet);
    --primary-dark:var(--hcp-violet-dark);
    --primary-darker:var(--hcp-dark);
    --accent:#E7DEFF;
    --accent-lime:var(--hcp-lime);
    --bg-app:#F5F6F9;
    --bg-light:#FAFAFC;
    --bg-lighter:#F1EDFF;
    --surface:#FFFFFF;
    --border:#E1E4EA;
    --border-strong:#CBD0DA;
    --text:#0B0C10;
    --text-gray:#4B5565;
    --text-mute:#8D95A5;
    --ok:#059669;
    --warn:#DC2626;
    --radius:8px;
    --shadow:0 1px 3px rgba(11,12,16,0.05), 0 10px 28px -12px rgba(11,12,16,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans','Inter',sans-serif;
    background:var(--bg-app);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.step-num,.eyebrow,.r-block-title{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}

  /* Top bar */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:62px; z-index:50;
    background:var(--hcp-dark);
    border-bottom:1px solid var(--hcp-border-dark);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    box-shadow:0 4px 20px rgba(0,0,0,0.35);
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .brand-logo-svg{
    display:flex; align-items:center; height:26px; cursor:pointer;
  }
  .brand-logo-svg svg{height:26px; width:auto;}
  .brand-divider{width:1px; height:24px; background:var(--hcp-border-dark);}
  .brand-text{line-height:1.2;}
  .brand-text .b1{color:#FFFFFF; font-weight:800; font-size:12px; letter-spacing:1px; text-transform:uppercase; font-family:'Space Grotesk',sans-serif;}
  .brand-text .b2{color:var(--hcp-gray); font-size:11px; font-weight:500;}
  .top-actions{display:flex; gap:8px;}
  .top-btn{
    background:rgba(255,255,255,0.06); color:#E2E5EB; border:1px solid rgba(255,255,255,0.12);
    padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.15s;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .top-btn:hover{background:rgba(255,255,255,0.12); color:#FFFFFF;}
  .top-btn.active{background:var(--hcp-violet); border-color:var(--hcp-violet); color:#FFFFFF; box-shadow:0 0 12px rgba(107,53,255,0.4);}
  .top-btn.btn-nuevo-highlight{background:var(--hcp-violet); border-color:var(--hcp-violet); color:#FFFFFF;}
  .top-btn.btn-nuevo-highlight:hover{background:var(--hcp-violet-dark);}

  /* Sidebar stepper */
  .sidebar{
    width:250px; flex-shrink:0; margin-top:62px;
    background:var(--surface); border-right:1px solid var(--border);
    height:calc(100vh - 62px); position:fixed; top:0; left:0; padding-top:14px;
    overflow-y:auto;
  }
  .sidebar-inner{padding:10px 10px 30px;}
  .sidebar-label{
    font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-mute);
    font-weight:800; padding:8px 12px 10px; font-family:'Space Grotesk',sans-serif;
  }
  .step-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:6px;
    cursor:pointer; margin-bottom:3px; transition:.12s;
    border:1px solid transparent;
  }
  .step-item:hover{background:var(--bg-light);}
  .step-item.current{background:var(--bg-lighter); border-color:var(--hcp-violet);}
  .step-num{
    width:26px; height:26px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:var(--hcp-dark);
    background:var(--bg-app); border:1px solid var(--border-strong);
    font-family:'Space Grotesk',sans-serif;
  }
  .step-item.current .step-num{background:var(--hcp-violet); color:#fff; border-color:var(--hcp-violet);}
  .step-item.done .step-num{background:var(--hcp-dark); color:var(--hcp-lime); border-color:var(--hcp-dark);}
  .step-item.done .step-num::after{content:'✓'; font-weight:800; font-size:12px; color:var(--hcp-lime);}
  .step-item.done .step-num{font-size:0;}
  .step-title{font-size:13px; font-weight:700; color:var(--text);}
  .step-item.current .step-title{color:var(--hcp-violet);}
  .step-body{min-width:0; flex:1;}
  .step-summary{
    font-size:11px; color:var(--text-mute); margin-top:2px; line-height:1.35;
  }
  .step-item.current .step-summary{color:var(--text-gray);}

  /* Main content */
  .main{margin-left:250px; margin-top:62px; flex:1; padding:34px 40px 80px; max-width:920px;}
  .main.wide{max-width:1040px;}

  .section-head{margin-bottom:24px;}
  .eyebrow{
    color:var(--hcp-violet); font-weight:800; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; margin-bottom:6px;
  }
  .section-head h1{font-size:24px; font-weight:800; color:var(--hcp-dark); margin:0 0 6px; letter-spacing:-0.03em;}
  .section-head p{color:var(--text-gray); font-size:13.5px; margin:0; max-width:680px; line-height:1.5;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .card-title{
    font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:13.5px; color:var(--hcp-dark);
    margin:0 0 16px; display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.4px;
  }
  .card-title .dot{width:6px; height:6px; border-radius:50%; background:var(--hcp-violet);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--hcp-dark);}
  .field .hint{font-size:11.5px; color:var(--text-mute); font-style:italic;}
  input[type=text], input[type=date], textarea, select{
    font-family:'Plus Jakarta Sans',sans-serif;
    border:1px solid var(--border-strong); border-radius:6px; padding:9px 12px; font-size:13.5px;
    color:var(--text); background:#fff; outline:none; transition:.12s;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus{
    border-color:var(--hcp-violet); box-shadow:0 0 0 3px rgba(107,53,255,0.16);
  }
  textarea{resize:vertical; min-height:60px; font-family:'Plus Jakarta Sans',sans-serif;}

  .radio-row{display:flex; gap:10px;}
  .radio-pill{
    border:1px solid var(--border-strong); border-radius:6px; padding:8px 16px; font-size:12.5px;
    font-weight:700; cursor:pointer; color:var(--text-gray); background:#fff; transition:.12s;
  }
  .radio-pill.selected{background:var(--hcp-dark); border-color:var(--hcp-dark); color:var(--hcp-lime);}

  /* Checklist rows */
  .check-row{
    display:flex; align-items:flex-start; gap:12px; padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .check-row:last-child{border-bottom:none;}
  .checkbox{
    width:20px; height:20px; border-radius:5px; border:2px solid var(--border-strong);
    flex-shrink:0; cursor:pointer; margin-top:2px; display:flex; align-items:center; justify-content:center;
    background:#fff; transition:.12s;
  }
  .checkbox.checked{background:var(--hcp-violet); border-color:var(--hcp-violet);}
  .checkbox.checked::after{content:'✓'; color:#fff; font-size:12px; font-weight:800;}
  .check-body{flex:1;}
  .check-label{font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px;}
  .check-sub{font-size:11.5px; color:var(--text-mute);}
  .check-note{
    margin-top:8px; width:100%; border:1px solid var(--border); border-radius:6px; padding:7px 9px;
    font-size:12px; font-family:'Plus Jakarta Sans',sans-serif; color:var(--text);
  }

  /* program table */
  .prog-table{width:100%; border-collapse:collapse;}
  .prog-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-mute);
    padding:8px 8px; border-bottom:2px solid var(--border); font-family:'Space Grotesk',sans-serif;
  }
  .prog-table td{padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .prog-name{font-size:13px; font-weight:700; color:var(--text);}
  .prog-desc{font-size:11.5px; color:var(--text-mute);}
  .prog-table input[type=text]{width:100%; font-size:12px; padding:6px 8px;}

  .verif-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .verif-table th{
    background:var(--bg-lighter); color:var(--hcp-dark); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.8px; padding:10px 8px; text-align:left; border-bottom:2px solid var(--hcp-violet);
    font-family:'Space Grotesk',sans-serif;
  }
  .verif-table td{padding:9px 8px; border-bottom:1px solid var(--border);}
  .verif-table td.center{text-align:center;}
  .verif-table input[type=text]{width:100%; font-size:12px; padding:5px 7px;}
  .radiodot{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--border-strong); margin:0 auto;
    cursor:pointer; transition:.12s;
  }
  .radiodot.ok.selected{background:var(--ok); border-color:var(--ok);}
  .radiodot.bad.selected{background:var(--warn); border-color:var(--warn);}

  .note-box{
    background:var(--bg-lighter); border:1px solid rgba(107,53,255,0.2); border-left:3px solid var(--hcp-violet);
    border-radius:6px; padding:12px 16px; font-size:12.5px; color:var(--hcp-dark); margin-top:10px; line-height:1.5;
  }
  .note-box b{color:var(--hcp-violet);}

  /* nav buttons */
  .nav-buttons{display:flex; justify-content:space-between; margin-top:26px;}
  .btn{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13px; padding:10px 20px; border-radius:6px;
    border:none; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.13s;
  }
  .btn-primary{background:var(--hcp-violet); color:#fff;}
  .btn-primary:hover{background:var(--hcp-violet-dark); box-shadow:0 4px 14px rgba(107,53,255,0.3);}
  .btn-ghost{background:#fff; color:var(--text-gray); border:1px solid var(--border-strong);}
  .btn-ghost:hover{background:var(--bg-light); color:var(--text);}
  .btn-dark{background:var(--hcp-dark); color:#fff;}
  .btn-dark:hover{background:#181A22;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .progress-track{height:3px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:24px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--hcp-violet),var(--hcp-lime)); transition:width .25s;}

  /* ---------- Report view ---------- */
  .report-sheet{
    background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow);
    padding:0; overflow:hidden;
  }
  .report-header{
    background:var(--hcp-dark);
    border-bottom:3px solid var(--hcp-violet);
    color:#fff; padding:28px 34px;
  }
  .report-header .rh-top{display:flex; justify-content:space-between; align-items:center;}
  .report-header .rh-brand{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--hcp-lime); font-weight:800; font-family:'Space Grotesk',sans-serif;}
  .report-header h2{font-size:22px; margin:6px 0 4px; font-weight:800; letter-spacing:-0.03em;}
  .report-header .rh-sub{color:var(--hcp-gray); font-size:12.5px;}
  .report-id{font-family:'JetBrains Mono',monospace; font-size:11px; color:#A1A7B5; text-align:right;}
  .report-body{padding:28px 34px;}
  .r-block{margin-bottom:24px;}
  .r-block-title{
    font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:12px; color:var(--hcp-dark);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; padding-bottom:8px;
    border-bottom:2px solid var(--hcp-violet); display:flex; align-items:center; gap:8px;
  }
  .r-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px;}
  .r-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .r-row .rk{color:var(--text-gray); font-weight:600;}
  .r-row .rv{color:var(--text); font-weight:700; text-align:right;}
  .r-check-list{list-style:none; padding:0; margin:0;}
  .r-check-list li{
    display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12.5px;
  }
  .r-mark{width:16px; height:16px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff;}
  .r-mark.yes{background:var(--hcp-dark); color:var(--hcp-lime);}
  .r-mark.no{background:var(--border-strong);}
  .r-obs{color:var(--text-mute); font-size:11.5px; margin-left:24px;}

  /* Historial */
  .hist-table{width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .hist-table th{
    background:var(--hcp-dark); color:#fff; text-align:left; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.8px; padding:12px 14px; font-weight:800; font-family:'Space Grotesk',sans-serif;
    border-bottom:2px solid var(--hcp-violet);
  }
  .hist-table td{padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px;}
  .hist-table tr:last-child td{border-bottom:none;}
  .hist-table tr:hover{background:var(--bg-light); cursor:pointer;}
  .badge{padding:3px 9px; border-radius:4px; font-size:11px; font-weight:700;}
  .badge.nuevo{background:#E6F7EC; color:var(--ok);}
  .badge.reciclado{background:var(--bg-lighter); color:var(--hcp-violet);}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-mute);
  }
  .empty-state .es-icon{font-size:34px; margin-bottom:10px;}

  /* Tarjeta estadística de instalaciones este mes (Estilo Manual HCP) */
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--hcp-violet);
    border-radius:var(--radius);
    padding:16px 20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .stat-icon-wrap{
    width:48px;
    height:48px;
    border-radius:8px;
    background:var(--bg-lighter);
    color:var(--hcp-violet);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border:1px solid rgba(107,53,255,0.2);
  }
  .stat-content{flex:1; min-width:0;}
  .stat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:2px;
  }
  .stat-label{
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-mute);
    font-family:'Space Grotesk',sans-serif;
  }
  .stat-period{
    font-size:11px;
    font-weight:700;
    color:var(--hcp-violet);
    background:var(--bg-lighter);
    padding:3px 10px;
    border-radius:4px;
    border:1px solid rgba(107,53,255,0.2);
    font-family:'Space Grotesk',sans-serif;
  }
  .stat-main{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:2px 0 4px;
  }
  .stat-number{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:800;
    color:var(--hcp-dark);
    line-height:1;
    letter-spacing:-0.03em;
  }
  .stat-unit{
    font-size:13px;
    font-weight:600;
    color:var(--text-gray);
  }
  .stat-sub{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    font-size:11.5px;
    color:var(--text-gray);
  }
  .stat-pill{
    padding:2px 8px;
    border-radius:4px;
    font-size:11px;
    font-weight:700;
  }
  .stat-pill.nuevo{background:#E6F7EC; color:var(--ok);}
  .stat-pill.reciclado{background:var(--bg-lighter); color:var(--hcp-violet);}
  .stat-divider{color:var(--border-strong);}
  .stat-total{color:var(--text-gray);}

  /* Admin */
  .admin-login-wrap{max-width:380px; margin:60px auto 0;}
  .admin-login-wrap .card{padding:28px 26px;}
  .admin-error{color:var(--warn); font-size:12.5px; font-weight:600; min-height:18px; margin-top:6px;}
  .admin-tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--border);}
  .admin-tab{
    padding:10px 16px; font-size:12.5px; font-weight:800; color:var(--text-gray); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px; text-transform:uppercase; letter-spacing:0.8px;
    font-family:'Space Grotesk',sans-serif;
  }
  .admin-tab.active{color:var(--hcp-violet); border-bottom-color:var(--hcp-violet);}
  .admin-row-actions{display:flex; gap:6px;}
  .icon-btn{
    background:#fff; border:1px solid var(--border-strong); border-radius:6px; padding:5px 9px;
    font-size:12px; cursor:pointer; transition:.12s;
  }
  .icon-btn:hover{background:var(--bg-light);}
  .icon-btn.danger{color:var(--warn); border-color:#E3B4AC;}
  .icon-btn.danger:hover{background:#FBEAE7;}
  .prog-admin-row{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .prog-admin-row:last-child{border-bottom:none;}
  .path-picker-row{display:flex; gap:8px; align-items:stretch;}
  .path-picker-row input{flex:1; min-width:0;}
  .path-picker-row .btn{flex-shrink:0; white-space:nowrap;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:4px;}

  @media print{
    .topbar,.sidebar,.nav-buttons,.report-actions,#toast{display:none !important;}
    .main{margin:0 !important; padding:0 !important; max-width:100% !important;}
    body{background:#fff;}
    .report-sheet{box-shadow:none; border:none;}
  }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--hcp-dark); color:#fff; padding:12px 22px; border-radius:6px; font-size:12.5px;
    font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:.25s; z-index:200;
    border:1px solid var(--hcp-border-dark);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:820px){
    .sidebar{display:none;}
    .main{margin-left:0; padding:24px 16px 60px;}
    .grid2{grid-template-columns:1fr;}
    .r-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo-svg" onclick="startNew()" title="HCP Architecture &amp; Engineering">
      <svg height="28" viewBox="0 0 186 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- H with architectural cut & evolution inner curve -->
        <path d="M 4 4 L 15 4 L 15 21 L 8 28 L 4 28 Z" fill="#FFFFFF"/>
        <path d="M 4 28 L 8 28 Q 15 28 15 34 L 15 48 L 4 48 Z" fill="#FFFFFF"/>
        <path d="M 14 23 L 36 23 L 36 29 L 14 29 Z" fill="#FFFFFF"/>

async function saveReport(){
  data.id = data.id || ('INF-' + Date.now().toString(36).toUpperCase());
  data.createdAt = data.createdAt || new Date().toISOString();

  // Copia local (funciona siempre, incluso si el servidor no responde)
  const local = getLocalReports();
  const idx = local.findIndex(r=>r.id===data.id);
  if(idx>=0) local[idx] = data; else local.push(data);
  const localOk = setLocalReports(local);

  // Guardado compartido en el servidor (PHP + IIS) — visible para todo el equipo
  // Si se está editando un informe ya existente (desde el panel de admin), se usa
  // el endpoint protegido update.php; si es un informe nuevo, se usa save.php.
  let sharedOk = false;
  try{
    const endpoint = editingExisting ? 'api/update.php' : 'api/save.php';
    const resp = await fetch(endpoint, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const j = await resp.json();
    sharedOk = !!(j && j.ok);
  }catch(e){ console.error('No se pudo guardar en el servidor:', e); }

  return { localOk, sharedOk };
}

async function loadHistory(){
  // El servidor es la fuente de verdad: todos los técnicos ven los mismos informes
  try{
    const resp = await fetch('api/list.php');
    const j = await resp.json();
    if(j && j.ok && Array.isArray(j.items)){
      const items = j.items.slice();
      items.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
      setLocalReports(items); // refresca la copia local con los datos del servidor
      return items;
    }
  }catch(e){ console.error('No se pudo leer el historial del servidor:', e); }

  // Si el servidor no responde (sin red, PHP caído, etc.) se usa la copia local
  const local = getLocalReports();
  local.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  return local;
}

function fmtBytes(bytes){
  if(!bytes && bytes !== 0) return '—';
  const units = ['B','KB','MB','GB'];
  let i = 0; let n = bytes;
  while(n >= 1024 && i < units.length-1){ n /= 1024; i++; }
  return `${n.toFixed(n>=10||i===0?0:1)} ${units[i]}`;
}

/* Especificaciones del equipo, vía HCPToolKit (ya no por detección del navegador):
   1) el técnico descarga el ejecutable HCPToolKit desde la carpeta compartida (configurable en Admin),
   2) lo ejecuta en el equipo, que genera un informe de hardware,
   3) se sube ese informe aquí y se rellenan los campos automáticamente. */

async function downloadHcpToolkit(){
  try{
    const resp = await fetch('api/hcptoolkit-download.php', {credentials:'same-origin'});
    const ct = resp.headers.get('Content-Type') || '';
    if(!resp.ok || ct.includes('application/json')){
      const j = await resp.json().catch(()=>null);
      toast((j && j.error) || 'No se pudo descargar HCPToolKit.');
      return;
    }
    const blob = await resp.blob();
    const cd = resp.headers.get('Content-Disposition') || '';
    const match = cd.match(/filename="([^"]+)"/);
    const filename = match ? match[1] : 'HCPToolKit.exe';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    toast('No se pudo conectar con el servidor para descargar HCPToolKit.');
  }
}

function handleSpecsPdfUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;

  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if(!isPdf){
    toast('Solo se admiten archivos PDF. Genera el informe con HCPToolKit y súbelo tal cual.');
    input.value = '';
    return;
  }
  if(file.size > 15 * 1024 * 1024){
    toast('El PDF pesa más de 15 MB — revisa que sea el informe correcto antes de subirlo.');
  }

  const reader = new FileReader();
  reader.onload = (e)=>{
    data.specs.pdfNombre = file.name;
    data.specs.pdfBase64 = String(e.target.result || '');
    renderAll();
    toast(`Informe "${file.name}" cargado`);
  };
  reader.onerror = ()=> toast('No se pudo leer el archivo');
  reader.readAsDataURL(file);
  input.value = '';
}

function removeSpecsPdf(){
  if(!confirm('¿Quitar el informe de especificaciones cargado?')) return;
  data.specs.pdfNombre = '';

/* ============== EXPORTAR PDF (rápido, sin páginas en blanco y fusionado con HCPToolKit) ============== */
function dataURLToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

      </div>

      <div style="margin-top:16px; padding-top:10px; border-top:1px solid #E1E4EA; display:flex; justify-content:space-between; font-size:9.5px; color:#888;">
        <div>HCP Architecture &amp; Engineering · Departamento de IT</div>
        <div>Control Oficial de Instalación de Equipos</div>
      </div>
    </div>
  `;

  document.body.appendChild(printEl);

  try{
    const canvas = await window.html2canvas(printEl, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: '#ffffff',
      width: 794,
      windowWidth: 794
    });

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4', orientation:'portrait' });

    const pageWidthPt = 595.28;
    const pageHeightPt = 841.89;
    const marginPt = 20;
    const printWidthPt = pageWidthPt - (marginPt * 2);
    const printHeightPt = pageHeightPt - (marginPt * 2);

    // Pixels de canvas correspondientes a 1 página imprimible
    const pageCanvasHeight = Math.floor(canvas.width * (printHeightPt / printWidthPt));
    const totalPages = Math.max(1, Math.ceil(canvas.height / pageCanvasHeight));

    for(let p = 0; p < totalPages; p++){
      if(p > 0) doc.addPage();
      const sourceY = p * pageCanvasHeight;
      const sliceHeight = Math.min(pageCanvasHeight, canvas.height - sourceY);

      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceHeight;
      const ctx = sliceCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
      ctx.drawImage(canvas, 0, sourceY, canvas.width, sliceHeight, 0, 0, canvas.width, sliceHeight);

      const sliceData = sliceCanvas.toDataURL('image/jpeg', 0.95);
      const renderedHeightPt = (sliceHeight / canvas.width) * printWidthPt;
      doc.addImage(sliceData, 'JPEG', marginPt, marginPt, printWidthPt, renderedHeightPt);
    }

    const reportBytes = doc.output('arraybuffer');
    const { PDFDocument } = window.PDFLib;
    const mergedDoc = await PDFDocument.load(reportBytes);

    if(reportData.specs && reportData.specs.pdfBase64){
      try{
        const specsBytes = dataURLToUint8Array(reportData.specs.pdfBase64);
        const specsDoc = await PDFDocument.load(specsBytes);
        const copiedPages = await mergedDoc.copyPages(specsDoc, specsDoc.getPageIndices());
        copiedPages.forEach(pg => mergedDoc.addPage(pg));
      }catch(e){
        console.error('No se pudo fusionar el PDF de especificaciones:', e);
        toast('Informe generado, pero no se pudo adjuntar el PDF de especificaciones.');
      }
    }

    const mergedBytes = await mergedDoc.save();
    const safeName = (reportData.general?.nombreEquipo || reportData.id || 'equipo').replace(/[^a-z0-9_-]+/gi, '_');
    downloadBlob(new Blob([mergedBytes], {type:'application/pdf'}), `Informe_instalacion_${safeName}.pdf`);
    toast('✓ PDF generado y descargado correctamente');
  }catch(e){
    console.error(e);
    toast('No se pudo generar el PDF: ' + (e.message || e));
  }finally{
    if(printEl.parentNode) printEl.parentNode.removeChild(printEl);
  }
}

/* ============== STATS: INSTALACIONES DEL MES ============== */
function getMonthlyStats(items){
  const now = new Date();
  const curY = now.getFullYear();
  const curM = now.getMonth();
  const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const monthName = monthNames[curM].charAt(0).toUpperCase() + monthNames[curM].slice(1);

  let thisMonthCount = 0;
  let nuevosCount = 0;
  let recicladosCount = 0;

  (items || []).forEach(it => {
    const rawDate = (it && it.general && it.general.fecha) || (it && it.createdAt);
    if(!rawDate) return;
    let itemY = null;
    let itemM = null;
    const str = String(rawDate).trim();
    if(/^\d{4}-\d{2}/.test(str)){
      const parts = str.slice(0, 7).split('-');
      itemY = parseInt(parts[0], 10);
      itemM = parseInt(parts[1], 10) - 1;
    } else {
      const d = new Date(str);
      if(!isNaN(d.getTime())){
        itemY = d.getFullYear();
        itemM = d.getMonth();
      }
    }
    if(itemY === curY && itemM === curM){
      thisMonthCount++;
      const tipo = it.general && it.general.tipo;
      if(tipo === 'Nuevo') nuevosCount++;
      else if(tipo === 'Reciclado') recicladosCount++;
    }
  });

  return {
    monthName,
    year: curY,
    thisMonthCount,
    nuevosCount,
    recicladosCount,
    totalCount: (items || []).length
  };
}

// Estado temporal de edición del catálogo de programas (se rellena al entrar en la pestaña)
let adminConfigDraft = null;

function adminConfigInitDraft(){
  if(adminConfigDraft) return;
  adminConfigDraft = {
    carpetaCompartida: CARPETA_COMPARTIDA,
    carpetaFisica: CARPETA_FISICA,
    rutaHCPToolKit: RUTA_HCPTOOLKIT,
    programs: PROGRAMS.map(p=>({...p})),
  };
}

function handleFolderPicked(input, draftKey, fieldId){
  if(!input.files || input.files.length===0) return;
  const first = input.files[0];
  const rel = first.webkitRelativePath || first.name;
  const folderName = rel.split('/')[0];

  adminConfigInitDraft();
  const current = (adminConfigDraft[draftKey] || '').trim();
  let updated;
  if(current){
    // Sustituye solo el último tramo de la ruta, conservando la unidad/servidor ya escritos
    const parts = current.split('\\');
    parts[parts.length - 1] = folderName;
    updated = parts.join('\\');
  } else {
    updated = folderName;
  }

  adminConfigDraft[draftKey] = updated;
  const field = document.getElementById(fieldId);
  if(field) field.value = updated;

  toast(`Carpeta seleccionada: "${folderName}". Por seguridad, ningún navegador revela la ruta de red completa — revisa que el resto de la ruta sea correcto.`);
  input.value = ''; // permite volver a elegir la misma carpeta más adelante si hace falta
}

function adminConfigAddProgram(){

  ${adminTab==='informes' ? renderAdminInformes() : renderAdminConfig()}
  <div style="margin-top:24px;">
    <button class="btn btn-ghost" onclick="adminLogout()">🔒 Cerrar sesión de admin</button>
  </div>
  `;
}

function renderAdminLogin(){
  return `
  <div class="admin-login-wrap">
    <div class="card">
      <div class="card-title"><span class="dot"></span>Acceso de administrador</div>
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="adminUser" placeholder="admin" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <div class="admin-error" id="adminLoginError"></div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="adminLogin()">Entrar</button>
    </div>
  </div>`;
}

function renderAdminInformes(){
  const items = window._adminInformes;
  if(!items) return `<div class="empty-state">Cargando informes…</div>`;
  const statsHTML = renderMonthlyStatsCard(items);
  if(items.length===0) return `${statsHTML}<div class="empty-state"><div class="es-icon">🗂</div>Aún no hay informes guardados.</div>`;
  return `
  ${statsHTML}
  <table class="hist-table">
    <thead><tr><th>Equipo</th><th>Técnico</th><th>Usuario asignado</th><th>Tipo</th><th>Fecha</th><th>Guardado</th><th>Acciones</th></tr></thead>
    <tbody>
      ${items.map(it=>`
        <tr>
          <td><b>${esc(it.general.nombreEquipo)||'—'}</b></td>
          <td>${esc(it.general.tecnico)||'—'}</td>
          <td>${esc(it.general.usuarioAsignado)||'—'}</td>
          <td><span class="badge ${it.general.tipo==='Nuevo'?'nuevo':'reciclado'}">${it.general.tipo}</span></td>
          <td>${fmtDate(it.general.fecha)}</td>
          <td>${fmtDate(it.createdAt)}</td>
          <td>
            <div class="admin-row-actions">
              <button class="icon-btn" onclick='adminEditReport(${JSON.stringify(it.id)})'>✏️ Editar</button>
              <button class="icon-btn danger" onclick='adminDeleteReport(${JSON.stringify(it.id)})'>🗑 Borrar</button>
            </div>
          </td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderAdminConfig(){
  adminConfigInitDraft();
  const d = adminConfigDraft;
  return `
  <div class="card">
    <div class="card-title"><span class="dot"></span>Carpeta compartida de instaladores</div>
    <div class="field">
      <label>Ruta que ven los técnicos (ej. Y:\\03_IT\\02_SOFTWARE_BASICO)</label>
      <div class="path-picker-row">
        <input type="text" id="fieldCarpetaCompartida" value="${esc(d.carpetaCompartida)}" oninput="adminConfigDraft.carpetaCompartida=this.value" placeholder="Y:\\03_IT\\02_SOFTWARE_BASICO">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('folderPickerCompartida').click()">📁 Examinar carpeta</button>
      </div>
      <input type="file" id="folderPickerCompartida" webkitdirectory directory multiple style="display:none" onchange="handleFolderPicked(this, 'carpetaCompartida', 'fieldCarpetaCompartida')">
      <span class="hint">Es la ruta que se muestra en el paso "Instalación de programas" para que cada técnico la abra desde su unidad mapeada.</span>
    </div>
    <div class="field">
      <label>Ruta UNC real para listar y descargar (ej. \\\\servidor\\recurso\\03_IT\\02_SOFTWARE_BASICO)</label>
      <div class="path-picker-row">
        <input type="text" id="fieldCarpetaFisica" value="${esc(d.carpetaFisica)}" oninput="adminConfigDraft.carpetaFisica=this.value" placeholder="\\\\servidor\\recurso\\03_IT\\02_SOFTWARE_BASICO">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('folderPickerFisica').click()">📁 Examinar carpeta</button>
      </div>
      <input type="file" id="folderPickerFisica" webkitdirectory directory multiple style="display:none" onchange="handleFolderPicked(this, 'carpetaFisica', 'fieldCarpetaFisica')">
      <span class="hint">Esta es la ruta que usa el propio servidor (PHP) para leer los archivos y ofrecer la descarga desde el navegador. Una letra de unidad (Y:) no sirve aquí porque solo existe en la sesión de cada técnico — hace falta la ruta UNC real. El App Pool de IIS necesita permisos de lectura sobre este recurso.</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot"></span>Ejecutable HCPToolKit</div>
    <div class="field">
      <label>Ruta UNC completa al ejecutable (ej. \\servidor\recurso\IT\HCPToolKit.exe)</label>
      <div class="path-picker-row">
        <input type="text" id="fieldRutaHCPToolKit" value="${esc(d.rutaHCPToolKit)}" oninput="adminConfigDraft.rutaHCPToolKit=this.value" placeholder="\\servidor\recurso\IT\HCPToolKit.exe">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('filePickerHCPToolKit').click()">📁 Examinar archivo</button>
      </div>
      <input type="file" id="filePickerHCPToolKit" style="display:none" onchange="handleFolderPicked(this, 'rutaHCPToolKit', 'fieldRutaHCPToolKit')">
      <span class="hint">Es el archivo que se descarga desde el paso "Especificaciones del equipo". El servidor necesita la ruta UNC completa hasta el .exe (no una letra de unidad) y permisos de lectura sobre ese recurso, igual que con la carpeta de software.</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span class="dot"></span>Catálogo de programas</div>
    ${d.programs.map((p,i)=>`
      <div class="prog-admin-row">
        <input type="text" value="${esc(p.name)}" oninput="adminConfigDraft.programs[${i}].name=this.value" placeholder="Nombre del programa">
        <input type="text" value="${esc(p.desc)}" oninput="adminConfigDraft.programs[${i}].desc=this.value" placeholder="Descripción breve">
        <button class="icon-btn danger" onclick="adminConfigRemoveProgram(${i})">🗑</button>
      </div>`).join('')}
    <div style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="adminConfigAddProgram()">＋ Añadir programa</button>
    </div>
  </div>
  <button class="btn btn-primary" onclick="adminConfigSave()">💾 Guardar configuración</button>
  `;
}

/* ============== ACTIONS ============== */
function startNew(){
  data = blankData();
  ensureP2Keys();
  editingExisting = false;
  currentStep = 0;
  viewMode = 'form';
  renderAll();
  toast('Nuevo informe iniciado');
}

/* ============== MASTER RENDER ============== */
function renderAll(){
  renderSidebar();
  const main = document.getElementById('main');

  document.getElementById('btnHist').classList.toggle('active', viewMode==='history' || viewMode==='view-saved');
  document.getElementById('btnNuevo').classList.toggle('active', false);
  document.getElementById('btnAdmin').classList.toggle('active', viewMode==='admin');

  if(viewMode === 'form'){
    main.classList.remove('wide');
    const progressPct = Math.round(((currentStep) / (STEPS.length-1)) * 100);
    main.innerHTML = `
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      ${STEP_RENDERERS[currentStep]()}
      ${renderNav()}
    `;
  } else if(viewMode === 'report'){
    main.classList.add('wide');
    main.innerHTML = renderReportView();
  } else if(viewMode === 'admin'){
    main.classList.add('wide');
    main.innerHTML = renderAdmin();
  } else if(viewMode === 'history'){
    main.classList.add('wide');
    // content injected by showHistory() itself after async load; render placeholder first
    if(!main.innerHTML || main.dataset.filled!=='history'){
      main.innerHTML = `<div class="section-head"><div class="eyebrow">Departamento de IT</div><h1>Historial de instalaciones</h1><p>Cargando…</p></div>`;
    }
  } else if(viewMode === 'view-saved'){
    main.classList.add('wide');
    main.innerHTML = renderViewSaved();
  }
  window.scrollTo(0,0);
}

/* ============== INIT ============== */
renderAll();
loadConfig();
checkAdminSession();
</script>
</body>
</html>
